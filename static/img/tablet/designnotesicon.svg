<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Design Notes icon">
  <defs>
    <radialGradient id="innerGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#90d83f" />
      <stop offset="100%" stop-color="#5ab81a" />
    </radialGradient>
  </defs>

  <!-- White outline ring -->
  <circle cx="400" cy="400" r="350" fill="none" stroke="#ffffff" stroke-width="18" />
  <!-- Green inner circle -->
  <circle cx="400" cy="400" r="338" fill="url(#innerGrad)" />

  <!-- Rounded square open at top-right -->
  <path
    d="M488,228 L288,228 Q236,228 236,280 L236,520 Q236,572 288,572 L504,572 Q556,572 556,520 L556,350"
    fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"
  />

  <!--
    Pencil drawn upright (tip pointing down in local coords), then rotated 45deg clockwise
    so tip points lower-left and eraser is at upper-right — standard edit icon orientation.
    Local coords centered at (0,0):
      - Eraser cap:  y = -118 to -96
      - Shaft body:  y = -96  to  84
      - Tip triangle: base at y=84, point at y=136
  -->
  <g transform="translate(536, 244) rotate(45)">
    <!-- Eraser cap -->
    <rect x="-24" y="-118" width="48" height="24" rx="8" fill="#cccccc" />
    <!-- Shaft -->
    <rect x="-24" y="-96" width="48" height="180" rx="12" fill="#ffffff" />
    <!-- Tip -->
    <polygon points="-24,84 24,84 0,136" fill="#ffffff" />
  </g>
</svg>
